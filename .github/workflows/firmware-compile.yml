name: Firmware compile

on:
  push:
    branches: [main]
    paths:
      - "Teplota_kancl.ino"
      - "*.h"
      - ".github/workflows/firmware-compile.yml"
  pull_request:
    paths:
      - "Teplota_kancl.ino"
      - "*.h"
      - ".github/workflows/firmware-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp8266:
    name: ESP8266 Arduino compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP8266 platform and SHT4x library
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli lib install "Adafruit SHT4x Library"

      - name: Compile for NodeMCU ESP8266
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --warnings default .
